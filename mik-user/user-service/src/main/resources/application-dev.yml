# 验证码配置 (AJ-Captcha)
aj:
  captcha:
    # 缓存类型: local/redis
    cache-type: redis
    # 验证码类型: clickWord/slide
    captcha-type: slide
    # 滑动验证
    slide:
      # 背景图片宽度
      width: 300
      # 背景图片高度
      height: 200
      # 滑块宽度
      template-width: 60
      # 滑块高度
      template-height: 60
    # 校验滑动区域误差范围
    slip-offset: 5

#配置可监控信息
management:
  #对外开放某个监控点
  endpoint:
    #health必须开
    health:
      show-details: always
      enabled: true
    #其他
    beans:
      enabled: true
  endpoints:
    #对web开启的监控点
    web:
      exposure:
        include: "*"
    #对外开放所有监控点
    enabled-by-default: true
