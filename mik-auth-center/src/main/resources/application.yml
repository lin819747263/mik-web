spring:
  cloud:
    loadbalancer:
      cache:
        enabled: true
    openfeign:
      circuitbreaker:
        enabled: false
      compression:
        request:
          enabled: true
          mime-types: text/xml,application/xml, application/json  # 压缩类型
          min-request-size: 1024  # 最小压缩值标准，当数据大于 1024 才会进行压缩
        response:
          enabled: true
      okhttp:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 5000
      autoconfiguration:
        jackson:
          enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

resilience4j:
  timelimiter:
    instances:
      UserRpcgetUserByIdentifyString:
        timeoutDuration: 10s # 设置超时时间为2秒

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

server:
  port: 8082

logging:
  level:
    com.mik.user.api: DEBUG

# 滑动验证码配置
tianai:
  captcha:
    # 缓存类型: default(内存) / redis
    cache-type: default
    # 验证码类型: slider(滑动)
    captcha-type: slider
    slider:
      # 背景图片尺寸
      bg-width: 300
      bg-height: 180
      # 滑块尺寸
      template-width: 60
      template-height: 58
      # 滑块形状: round(圆形) / rect(方形)
      template-shape: round
